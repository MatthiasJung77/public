    <line x1="0" y1="10" x2="55" y2="55" stroke="#1E3A5F"/>
    <line x1="-60" y1="-40" x2="60" y2="-50" stroke="#74C69D" stroke-dasharray="6 8"/>
    <circle cx="-60" cy="-40" r="14" fill="#1B4332" stroke="none"/>
    <circle cx="60" cy="-50" r="11" fill="#52B788" stroke="none"/>
    <circle cx="0" cy="10" r="18" fill="#1B4332" stroke="none"/>
