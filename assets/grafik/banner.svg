<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Matthias Jung. Denken mit Struktur. Öffentliche Sammlung">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF7F4"/>
      <stop offset="1" stop-color="#EDE7DC"/>
    </linearGradient>
    <style>
      .display { font-family: 'Syne', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .body { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#E5DDD0"/>

  <text x="80" y="118" class="body" font-size="15" letter-spacing="3" fill="#6B7280">ÖFFENTLICHE SAMMLUNG</text>
  <text x="80" y="182" class="display" font-size="64" font-weight="700" fill="#1B4332">Matthias Jung</text>
  <text x="80" y="226" class="display" font-size="26" font-weight="600" fill="#52B788">Denken mit Struktur</text>
